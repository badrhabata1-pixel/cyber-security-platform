<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P3 - Intrusion Detection Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
    .status-badge { background: #22c55e; color: #000; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
    .card h3 { margin: 0; font-size: 14px; color: #94a3b8; }
    .card .num { font-size: 26px; font-weight: bold; margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-size: 13px; text-transform: uppercase; }
    .sev-critical { color: #ef4444; font-weight: bold; }
    .sev-high { color: #f97316; font-weight: bold; }
    .sev-medium { color: #eab308; }
    .sev-low { color: #3b82f6; }
    .btn-action { background: #334155; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-action:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛡️ Intrusion Detection System (P3)</h2>
    <div>WebSocket: <span id="ws-status" class="status-badge">Connecting...</span></div>
  </div>

  <div class="cards">
    <div class="card"><h3>TOTAL ALERTS</h3><div id="stat-total" class="num">0</div></div>
    <div class="card"><h3>CRITICAL</h3><div id="stat-crit" class="num sev-critical">0</div></div>
    <div class="card"><h3>HIGH</h3><div id="stat-high" class="num sev-high">0</div></div>
    <div class="card"><h3>MEDIUM / LOW</h3><div id="stat-med" class="num sev-medium">0</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Time (UTC)</th>
        <th>Severity</th>
        <th>Rule</th>
        <th>Source IP</th>
        <th>Count</th>
        <th>Description</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="alerts-table">
      <!-- Data injected here -->
    </tbody>
  </table>

  <script>
    const API_BASE = window.location.origin;

    async function loadAlerts() {
      try {
        const res = await fetch(`${API_BASE}/alerts`);
        const alerts = await res.json();
        renderTable(alerts);
        updateStats(alerts);
      } catch (e) {
        console.error(e);
      }
    }

    function renderTable(alerts) {
      const tbody = document.getElementById("alerts-table");
      tbody.innerHTML = "";
      alerts.forEach(a => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>#${a.id}</td>
          <td>${a.created_at}</td>
          <td class="sev-${a.severity}">${a.severity.toUpperCase()}</td>
          <td><b>${a.rule}</b></td>
          <td><code>${a.ip}</code></td>
          <td>${a.count}</td>
          <td>${a.description}</td>
          <td><span style="color:${a.status==='open'?'#ef4444':'#22c55e'}">${a.status}</span></td>
          <td>
            ${a.status === 'open' 
              ? `<button class="btn-action" onclick="changeStatus(${a.id}, 'acknowledged')">Acknowledge</button>`
              : a.status === 'acknowledged'
              ? `<button class="btn-action" onclick="changeStatus(${a.id}, 'resolved')">Resolve</button>`
              : `<span>✅ Done</span>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateStats(alerts) {
      document.getElementById("stat-total").innerText = alerts.length;
      document.getElementById("stat-crit").innerText = alerts.filter(a => a.severity === 'critical').length;
      document.getElementById("stat-high").innerText = alerts.filter(a => a.severity === 'high').length;
      document.getElementById("stat-med").innerText = alerts.filter(a => a.severity === 'medium' || a.severity === 'low').length;
    }

    async function changeStatus(id, nextStatus) {
      await fetch(`${API_BASE}/alerts/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nextStatus })
      });
      loadAlerts();
    }

    // --- WebSocket Live Stream ---
    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProto}//${window.location.host}/ws/alerts`);

    ws.onopen = () => {
      const badge = document.getElementById("ws-status");
      badge.innerText = "LIVE";
      badge.style.background = "#22c55e";
    };

    ws.onmessage = (event) => {
      // إعادة تحميل اللوحة فور وصول أي تنبيه لحظي
      loadAlerts();
    };

    ws.onclose = () => {
      const badge = document.getElementById("ws-status");
      badge.innerText = "DISCONNECTED";
      badge.style.background = "#ef4444";
    };

    // تحميل أولي
    loadAlerts();
  </script>
</body>
</html>
