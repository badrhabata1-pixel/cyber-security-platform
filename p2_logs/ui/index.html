<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Analysis / SIEM</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{font-family:system-ui;margin:24px;background:#0e1621;color:#e7eef7}main{max-width:1200px;margin:auto}.cards{display:flex;gap:16px;flex-wrap:wrap}.card,section{background:#172435;padding:16px;border-radius:8px;margin:16px 0}.card{min-width:160px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;text-align:left;border-bottom:1px solid #30445c}input{padding:8px;margin:8px 6px 8px 0}canvas{max-height:280px}#map{height:360px}</style></head><body><main><h1>Log Analysis / SIEM</h1><div class="cards"><div class="card">Total events<br><strong id="total">–</strong></div><div class="card">Failed events<br><strong id="failed">–</strong></div></div><section><canvas id="chart"></canvas></section><section><h2>Geographic activity</h2><div id="map"></div></section><section><input id="ip" placeholder="Filter IP"><button onclick="loadEvents()">Filter</button><table><thead><tr><th>Time (UTC)</th><th>Source</th><th>IP</th><th>User</th><th>Event</th><th>Location</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>let map=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);async function api(u){return (await fetch(u)).json()}async function loadEvents(){let ip=document.getElementById('ip').value,d=await api('/events?limit=100'+(ip?'&ip='+encodeURIComponent(ip):''));document.getElementById('rows').innerHTML=d.events.map(e=>`<tr><td>${e.timestamp}</td><td>${e.source}</td><td>${e.ip||''}</td><td>${e.username||''}</td><td>${e.event_type}</td><td>${[e.city,e.country].filter(Boolean).join(', ')}</td></tr>`).join('')}async function init(){let s=await api('/stats/summary'),g=await api('/stats/geo');total.textContent=s.total_events;failed.textContent=s.failed_logins;new Chart(document.getElementById('chart'),{type:'bar',data:{labels:s.top_ips.map(x=>x.value),datasets:[{label:'Failed events by IP',data:s.top_ips.map(x=>x.count)}]}});g.locations.filter(x=>x.latitude!=null).forEach(x=>L.circleMarker([x.latitude,x.longitude],{radius:Math.max(5,Math.sqrt(x.count)*4)}).addTo(map).bindPopup(`${x.ip}: ${x.count} events<br>${x.city||''} ${x.country||''}`));loadEvents()}init()</script></body></html>
